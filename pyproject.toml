[project]
name = "job-finder"
version = "0.1.0"
description = "Buscador y filtrador inteligente de ofertas de empleo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "jinja2>=3.1.4",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "google-genai>=2.34.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "src.web.main:app"